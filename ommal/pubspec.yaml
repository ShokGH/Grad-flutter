name: ommal
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  step_progress: 2.7.1

  cupertino_icons: ^1.0.8

  flutter_localizations:
    sdk: flutter
  
  intl: any

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:
  uses-material-design: true
  generate: true

  assets:
    - assets/imgs/landing1.png
    - assets/imgs/landing2.png
    - assets/imgs/customerimg.png
    - assets/imgs/workerimg.png

  fonts:

    - family: cairo
      fonts:
        - asset: assets\CairoFont.ttf